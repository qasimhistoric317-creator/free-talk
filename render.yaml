# Free Talk — Render Blueprint
# Creates: 1 web service (Node, free tier) + 1 Postgres database (free tier).
# Free-tier notes (known upfront): the web service sleeps after ~15 min idle
# (~1 min wake), and the free Postgres expires after 30 days — upgrade the
# database (Basic ~$6/mo) and service (Starter $7/mo) before then for always-on.
services:
  - type: web
    name: free-talk
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: free-talk-db
          property: connectionString
      - key: OWNER_EASYPAISA
        value: "03365913165"
    healthCheckPath: /api/health
databases:
  - name: free-talk-db
    plan: free
